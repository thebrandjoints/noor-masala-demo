<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor Store | Premium Spices, Dates & Groceries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <style>
    html.lenis { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }
    .lenis.lenis-scrolling iframe { pointer-events: none; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f5f5f5; }
    ::-webkit-scrollbar-thumb { background: #171717; border-radius: 4px; }
    
    /* Elegant Header Links */
    .nav-link { position: relative; }
    .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #171717; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
  </style>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col text-neutral-900 bg-white">

  <div id="top-utility-bar"></div>
  <header id="main-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-neutral-100 shadow-sm transition-all"></header>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-menu" class="fixed inset-0 bg-neutral-900/50 z-50 hidden">
    <div class="absolute inset-y-0 left-0 w-64 bg-white shadow-2xl flex flex-col p-6 transform -translate-x-full transition-transform duration-300" id="mobile-menu-panel">
      <div class="flex justify-between items-center mb-8 border-b border-neutral-100 pb-4">
        <span class="text-xl font-black uppercase">Menu</span>
        <button id="close-mobile-menu" class="text-neutral-500 hover:text-neutral-900">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="flex flex-col gap-6 text-sm font-semibold uppercase tracking-widest text-neutral-600">
        <a href="#home" class="mobile-link hover:text-neutral-900">Home</a>
        <a href="#shop" class="mobile-link hover:text-neutral-900">Shop All</a>
        <a href="#bundles" class="mobile-link hover:text-neutral-900">Bundles</a>
      </nav>
    </div>
  </div>

  <!-- Slide-out Mini Cart -->
  <div id="mini-cart" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 bg-neutral-900 text-white flex justify-between items-center">
      <span class="font-bold uppercase tracking-wider">Your Cart</span>
      <button onclick="closeMiniCart()" class="text-white hover:opacity-70">&times; Close</button>
    </div>
    <div id="mini-cart-content" class="flex-1 overflow-y-auto p-4 flex flex-col"></div>
  </div>

  <!-- Main Content -->
  <main id="app-content" class="flex-grow"></main>

  <!-- NEW: Footer Mount Point -->
  <footer id="main-footer"></footer>

  <script src="js/state.js"></script>
  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/home.js"></script>
  <script src="js/pdp.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
